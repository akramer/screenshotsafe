<!DOCTYPE html>
<html data-theme-loading="true" style="visibility:hidden">
<head>
    <meta charset="utf-8">
    <title>ScreenshotSafe Connection</title>
    <script src="webext-api.js"></script>
    <script src="theme.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            --page-bg: #eef1f6;
            --panel-bg: #ffffff;
            --secondary-bg: #f4f6fb;
            --secondary-hover: #e9edf7;
            --text: #191b25;
            --muted: #626778;
            --border-subtle: rgba(25,27,37,0.12);
            --border-strong: rgba(25,27,37,0.18);
            --shadow: 0 24px 80px rgba(28,36,58,0.18);
            --primary: #4f56e8;
            --primary-hover: #3f46d0;
            --notice-bg: rgba(199,118,0,0.09);
            --notice-border: rgba(199,118,0,0.28);
            --notice-text: #8a5600;
            --ok: #087d4a;
            --bad: #d92d4b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --page-bg: #0f0f13;
                --panel-bg: #14141d;
                --secondary-bg: #1a1a24;
                --secondary-hover: #22223a;
                --text: #e8e8f0;
                --muted: #aaa;
                --border-subtle: rgba(255,255,255,0.08);
                --border-strong: rgba(255,255,255,0.1);
                --shadow: 0 24px 80px rgba(0,0,0,0.35);
                --primary: #6a6aff;
                --primary-hover: #8484ff;
                --notice-bg: rgba(255,199,95,0.1);
                --notice-border: rgba(255,199,95,0.35);
                --notice-text: #ffd68a;
                --ok: #66e0a3;
                --bad: #ff6b83;
            }
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --page-bg: #eef1f6;
            --panel-bg: #ffffff;
            --secondary-bg: #f4f6fb;
            --secondary-hover: #e9edf7;
            --text: #191b25;
            --muted: #626778;
            --border-subtle: rgba(25,27,37,0.12);
            --border-strong: rgba(25,27,37,0.18);
            --shadow: 0 24px 80px rgba(28,36,58,0.18);
            --primary: #4f56e8;
            --primary-hover: #3f46d0;
            --notice-bg: rgba(199,118,0,0.09);
            --notice-border: rgba(199,118,0,0.28);
            --notice-text: #8a5600;
            --ok: #087d4a;
            --bad: #d92d4b;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --page-bg: #0f0f13;
            --panel-bg: #14141d;
            --secondary-bg: #1a1a24;
            --secondary-hover: #22223a;
            --text: #e8e8f0;
            --muted: #aaa;
            --border-subtle: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.1);
            --shadow: 0 24px 80px rgba(0,0,0,0.35);
            --primary: #6a6aff;
            --primary-hover: #8484ff;
            --notice-bg: rgba(255,199,95,0.1);
            --notice-border: rgba(255,199,95,0.35);
            --notice-text: #ffd68a;
            --ok: #66e0a3;
            --bad: #ff6b83;
        }
        :root[data-theme-loading="true"] { visibility: hidden; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--page-bg);
            color: var(--text);
        }
        main {
            width: min(520px, 100%);
            padding: 22px;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: var(--panel-bg);
            box-shadow: var(--shadow);
        }
        h1 {
            margin-bottom: 6px;
            font-size: 18px;
            font-weight: 650;
        }
        .subhead {
            margin-bottom: 20px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .notice {
            display: none;
            margin-bottom: 16px;
            padding: 10px 12px;
            border: 1px solid var(--notice-border);
            border-radius: 8px;
            background: var(--notice-bg);
            color: var(--notice-text);
            font-size: 13px;
            line-height: 1.4;
        }
        .notice.show { display: block; }
        .actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-top: 18px;
        }
        button {
            min-height: 40px;
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
        }
        .primary {
            background: var(--primary);
            color: #fff;
        }
        .primary:hover { background: var(--primary-hover); }
        .secondary {
            border: 1px solid var(--border-strong);
            background: var(--secondary-bg);
            color: var(--text);
        }
        .secondary:hover { background: var(--secondary-hover); }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .status {
            min-height: 20px;
            margin-top: 14px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.4;
        }
        .status.ok { color: var(--ok); }
        .status.bad { color: var(--bad); }
    </style>
</head>
<body>
    <main>
        <h1>ScreenshotSafe Connection</h1>
        <p class="subhead">
            Server and API-token configuration is managed by the ScreenshotSafe app.
            This extension does not request access to your configured server.
        </p>
        <div class="notice" id="notice"></div>

        <div class="actions">
            <button class="primary" id="check-btn" type="button">Check Connection</button>
            <button class="secondary" id="close-btn" type="button">Close</button>
        </div>

        <div class="status" id="status"></div>
    </main>

    <script src="options.js"></script>
</body>
</html>
