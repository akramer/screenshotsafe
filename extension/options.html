<!DOCTYPE html>
<html data-theme-loading="true" style="visibility:hidden">
<head>
    <meta charset="utf-8">
    <title>ScreenshotSafe Settings</title>
    <script src="webext-api.js"></script>
    <script src="connections.js"></script>
    <script src="theme.js"></script>
    <style>
        :root {
            color-scheme: light dark;
            --page-bg: #eef1f6;
            --panel-bg: #ffffff;
            --field-bg: #f8f9fc;
            --secondary-bg: #f4f6fb;
            --secondary-hover: #e9edf7;
            --text: #191b25;
            --muted: #626778;
            --label: #6a7080;
            --border-subtle: rgba(25,27,37,0.12);
            --border-strong: rgba(25,27,37,0.18);
            --shadow: 0 24px 80px rgba(28,36,58,0.18);
            --primary: #4f56e8;
            --primary-hover: #3f46d0;
            --focus: rgba(79,86,232,0.18);
            --notice-bg: rgba(199,118,0,0.09);
            --notice-border: rgba(199,118,0,0.28);
            --notice-text: #8a5600;
            --ok: #087d4a;
            --bad: #d92d4b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --page-bg: #0f0f13;
                --panel-bg: #14141d;
                --field-bg: #0f0f13;
                --secondary-bg: #1a1a24;
                --secondary-hover: #22223a;
                --text: #e8e8f0;
                --muted: #aaa;
                --label: #888;
                --border-subtle: rgba(255,255,255,0.08);
                --border-strong: rgba(255,255,255,0.1);
                --shadow: 0 24px 80px rgba(0,0,0,0.35);
                --primary: #6a6aff;
                --primary-hover: #8484ff;
                --focus: rgba(106,106,255,0.16);
                --notice-bg: rgba(255,199,95,0.1);
                --notice-border: rgba(255,199,95,0.35);
                --notice-text: #ffd68a;
                --ok: #66e0a3;
                --bad: #ff6b83;
            }
        }
        :root[data-theme="light"] {
            color-scheme: light;
            --page-bg: #eef1f6;
            --panel-bg: #ffffff;
            --field-bg: #f8f9fc;
            --secondary-bg: #f4f6fb;
            --secondary-hover: #e9edf7;
            --text: #191b25;
            --muted: #626778;
            --label: #6a7080;
            --border-subtle: rgba(25,27,37,0.12);
            --border-strong: rgba(25,27,37,0.18);
            --shadow: 0 24px 80px rgba(28,36,58,0.18);
            --primary: #4f56e8;
            --primary-hover: #3f46d0;
            --focus: rgba(79,86,232,0.18);
            --notice-bg: rgba(199,118,0,0.09);
            --notice-border: rgba(199,118,0,0.28);
            --notice-text: #8a5600;
            --ok: #087d4a;
            --bad: #d92d4b;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --page-bg: #0f0f13;
            --panel-bg: #14141d;
            --field-bg: #0f0f13;
            --secondary-bg: #1a1a24;
            --secondary-hover: #22223a;
            --text: #e8e8f0;
            --muted: #aaa;
            --label: #888;
            --border-subtle: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.1);
            --shadow: 0 24px 80px rgba(0,0,0,0.35);
            --primary: #6a6aff;
            --primary-hover: #8484ff;
            --focus: rgba(106,106,255,0.16);
            --notice-bg: rgba(255,199,95,0.1);
            --notice-border: rgba(255,199,95,0.35);
            --notice-text: #ffd68a;
            --ok: #66e0a3;
            --bad: #ff6b83;
        }
        :root[data-theme-loading="true"] { visibility: hidden; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--page-bg);
            color: var(--text);
        }
        main {
            width: min(760px, 100%);
            padding: 22px;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            background: var(--panel-bg);
            box-shadow: var(--shadow);
        }
        h1 {
            font-size: 18px;
            font-weight: 650;
            margin-bottom: 6px;
        }
        .subhead {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
            margin-bottom: 20px;
        }
        .notice {
            display: none;
            margin-bottom: 16px;
            padding: 10px 12px;
            border: 1px solid var(--notice-border);
            border-radius: 8px;
            background: var(--notice-bg);
            color: var(--notice-text);
            font-size: 13px;
            line-height: 1.4;
        }
        .notice.show { display: block; }
        .form-group { margin-bottom: 14px; }
        label {
            display: block;
            margin-bottom: 5px;
            color: var(--label);
            font-size: 11px;
            font-weight: 650;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            background: var(--field-bg);
            color: var(--text);
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--focus);
        }
        .actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-top: 18px;
        }
        button {
            min-height: 40px;
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            transition: 0.15s ease;
        }
        .primary {
            background: var(--primary);
            color: #fff;
        }
        .primary:hover { background: var(--primary-hover); }
        .secondary {
            background: var(--secondary-bg);
            border: 1px solid var(--border-strong);
            color: var(--text);
        }
        .secondary:hover {
            background: var(--secondary-hover);
            border-color: var(--border-strong);
        }
        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .status {
            min-height: 20px;
            margin-top: 14px;
            font-size: 13px;
            line-height: 1.4;
            color: var(--muted);
        }
        .status.ok { color: var(--ok); }
        .status.bad { color: var(--bad); }
        .section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: 18px 0 10px;
        }
        .section-heading h2 { font-size: 14px; }
        .server-list {
            display: grid;
            gap: 8px;
        }
        .server-row {
            display: grid;
            grid-template-columns: auto minmax(170px, 1fr) minmax(150px, auto) auto;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            background: var(--field-bg);
        }
        .server-row.active { border-color: var(--primary); }
        .server-details { display: grid; gap: 3px; min-width: 0; }
        .server-details strong {
            overflow: hidden;
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .server-account { color: var(--muted); font-size: 12px; }
        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 12px;
        }
        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bad);
        }
        .status-connected .connection-dot { background: var(--ok); }
        .status-checking .connection-dot { background: var(--muted); }
        .server-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
        .small-button { min-height: 30px; padding: 5px 9px; font-size: 12px; }
        .small-button.primary { background: var(--primary); color: #fff; }
        .small-button.secondary {
            border: 1px solid var(--border-strong);
            background: var(--secondary-bg);
            color: var(--text);
        }
        .small-button.danger {
            border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent);
            background: transparent;
            color: var(--bad);
        }
        .empty-state {
            padding: 16px;
            border: 1px dashed var(--border-strong);
            border-radius: 8px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }
        .add-server {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
        }
        .add-server label { grid-column: 1 / -1; }
        @media (max-width: 680px) {
            .server-row { grid-template-columns: auto 1fr; }
            .connection-status, .server-actions { grid-column: 2; justify-content: flex-start; }
        }
    </style>
</head>
<body>
    <main>
        <h1>ScreenshotSafe Settings</h1>
        <p class="subhead">Connect one or more ScreenshotSafe servers and choose where new screenshots are uploaded.</p>
        <div class="notice" id="notice"></div>

        <div class="section-heading">
            <h2>Connected servers</h2>
            <button class="small-button secondary" id="refresh-btn" type="button">Refresh all</button>
        </div>
        <div class="empty-state" id="empty-state">No ScreenshotSafe servers are connected yet.</div>
        <div class="server-list" id="server-list"></div>

        <div class="section-heading">
            <h2>Add a server</h2>
        </div>
        <div class="form-group add-server">
            <label for="server-url">ScreenshotSafe Server</label>
            <input type="text" id="server-url" placeholder="screenshots.example.com" aria-label="ScreenshotSafe server">
            <button class="primary" id="login-btn" type="button">Log in</button>
        </div>

        <div class="actions">
            <div></div>
            <button class="secondary" id="close-btn" type="button">Close</button>
        </div>

        <div class="status" id="status"></div>
    </main>

    <script src="options.js"></script>
</body>
</html>
